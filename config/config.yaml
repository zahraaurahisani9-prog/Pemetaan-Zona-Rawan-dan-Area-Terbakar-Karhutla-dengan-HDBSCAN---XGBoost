# ==============================================================================
# PROJECT INFORMATION
# ==============================================================================

project:
  name: "Karhutla XGBoost Classification"
  author: "Zahra Aura Hisani"
  description: "Pixel-based burned area classification using Sentinel-2 and XGBoost"
  version: "1.0"

# ==============================================================================
# PATH CONFIGURATION
# ==============================================================================

paths:

  # Input raster
  processed_data: "data/processed"

  # Output dataset
  feature_data: "data/features"

# ==============================================================================
# INPUT RASTER
# ==============================================================================

input:

  sentinel: "sentinel_processed.tif"

  burned: "burned_area.tif"

# ==============================================================================
# OUTPUT FILES
# ==============================================================================

output:

  parquet: "classification_dataset.parquet"

  csv: "classification_dataset.csv"

  summary: "classification_summary.json"

# ==============================================================================
# SENTINEL CONFIGURATION
# ==============================================================================

sentinel:

  bands:
    - B2
    - B3
    - B4
    - B8
    - B11
    - B12

  nodata: null

# ==============================================================================
# BURNED AREA LABEL
# ==============================================================================

burned:

  positive_label: 1

  negative_label: 0

# ==============================================================================
# FEATURE ENGINEERING
# ==============================================================================

features:

  calculate_nbr: true

# ==============================================================================
# DATA CLEANING
# ==============================================================================

cleaning:

  remove_nan: true

  remove_inf: true

  reflectance_min: 0

  reflectance_max: 10000

# ==============================================================================
# STREAMING WRITER
# ==============================================================================

writer:

  format: "parquet"

  compression: "snappy"

# ==============================================================================
# LOGGING
# ==============================================================================

logging:

  level: "INFO"